*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:var(--bg);color-scheme:dark;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{min-height:100vh;background:var(--bg);color:var(--tx);font:15px/1.6 var(--fa);overflow-x:hidden;-webkit-font-smoothing:antialiased}
html[lang=en] body{font-family:var(--sans)}
button,a{font:inherit;color:inherit;text-decoration:none;border:0;background:none;cursor:pointer}
button:focus-visible,a:focus-visible{outline:2px solid var(--g2);outline-offset:3px;border-radius:12px}
svg{display:block}
.en,.num,.mono{font-family:var(--sans);direction:ltr;unicode-bidi:isolate}
.mono{font-family:var(--mono)}
.bgfx{position:fixed;top:0;right:0;bottom:0;left:0;z-index:0;pointer-events:none;overflow:hidden}
.bgfx:before{content:"";position:absolute;width:900px;height:900px;top:-480px;left:50%;margin-left:-450px;background:radial-gradient(closest-side,rgba(212,169,74,.20),rgba(212,169,74,.05) 55%,transparent)}
.bgfx:after{content:"";position:absolute;top:0;right:0;bottom:0;left:0;background-image:radial-gradient(rgba(247,231,176,.10) 1px,transparent 1px);background-size:26px 26px;-webkit-mask-image:linear-gradient(180deg,#000 0,transparent 520px);mask-image:linear-gradient(180deg,#000 0,transparent 520px)}
.wrap{position:relative;z-index:1;max-width:520px;margin:0 auto;padding:12px 16px 110px;padding:calc(12px + env(safe-area-inset-top,0px)) calc(16px + env(safe-area-inset-right,0px)) calc(110px + var(--safe)) calc(16px + env(safe-area-inset-left,0px))}
.top{display:flex;align-items:center;justify-content:space-between;height:52px;margin-bottom:8px}
.brand{display:flex;align-items:center;gap:10px}
.brand .lg{width:34px;height:34px;border-radius:11px;background:#0b0a08;border:1px solid var(--ln2);display:grid;place-items:center}
.brand b{font:800 17px/1 var(--sans);letter-spacing:.32em;color:#ecd38f;direction:ltr}
.brand small{display:block;font:600 9px/1 var(--sans);letter-spacing:.3em;color:var(--mu2);margin-top:4px;direction:ltr}
.lang{display:flex;padding:3px;border-radius:999px;border:1px solid var(--ln);background:rgba(255,255,255,.02)}
.lang button{font:700 11px/1 var(--sans);letter-spacing:.12em;padding:8px 12px;border-radius:999px;color:var(--mu)}
.lang button.on{background:var(--gold);color:#1a1307}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}

/* panels */
.pn{position:relative;background:linear-gradient(180deg,rgba(27,23,16,.9),rgba(14,12,9,.92));border:1px solid var(--ln);border-radius:var(--r);padding:18px;margin-bottom:14px}

.warn{display:flex;gap:10px;align-items:flex-start;margin-top:14px;padding:12px 14px;border-radius:14px;background:rgba(232,183,92,.07);border:1px solid rgba(232,183,92,.28);color:#f1d29a;font-size:13px;line-height:1.75}

/* sub link */
.lk{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:14px;background:#090806;border:1px dashed var(--ln2)}

@keyframes bs{0%,60%{left:-50%}100%{left:130%}}
.btn.ok{background:#12251a!important;color:var(--ok)!important;border:1px solid rgba(95,211,141,.4)!important;box-shadow:none!important}

.rp{position:absolute;border-radius:50%;transform:scale(0);background:rgba(255,255,255,.35);animation:rp .6s ease-out forwards;pointer-events:none}

.dev{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:var(--mu);padding:6px 11px;border-radius:999px;border:1px solid var(--ln);white-space:nowrap}

.oss{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -2px 14px;padding:2px;direction:ltr}

.oss button{flex:none;font:700 12px/1 var(--sans);padding:10px 14px;border-radius:12px;border:1px solid var(--ln);color:var(--mu);background:rgba(0,0,0,.2);transition:.2s}

.feat{border-radius:18px;padding:16px;background:radial-gradient(120% 120% at 100% 0%,rgba(212,169,74,.16),transparent 55%),#0a0907;border:1px solid var(--ln2)}
.fl{font:700 9.5px/1 var(--sans);letter-spacing:.28em;color:var(--g3);direction:ltr;text-align:left;margin-bottom:12px}
.fr{display:flex;align-items:center;gap:13px}
.ai{flex:none;width:52px;height:52px;border-radius:15px;display:grid;place-items:center;font:800 16px/1 var(--sans);color:#fff;letter-spacing:.02em;background:linear-gradient(145deg,var(--a1),var(--a2));box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 10px 20px -10px var(--a1);direction:ltr}

.fn{font:800 18px/1.2 var(--sans);direction:ltr;text-align:right}

.fd{font-size:12.5px;color:var(--mu);margin-top:3px}
.fb{display:grid;grid-template-columns:1.7fr 1fr;gap:8px;margin-top:14px}
.al{margin-top:10px}
.ar{display:flex;align-items:center;gap:12px;padding:11px 4px;border-bottom:1px solid rgba(212,169,74,.08)}

.an{font:700 14.5px/1.2 var(--sans)}

.aa{display:flex;gap:6px}
.mn{height:36px;min-width:36px;padding:0 12px;border-radius:11px;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:700;font-size:12.5px;border:1px solid var(--ln2);background:#17130d;transition:.2s}

.mn.ok{color:var(--ok);border-color:rgba(95,211,141,.4);background:#12251a}

.seg{position:relative;display:grid;grid-template-columns:1fr 1fr;padding:4px;border-radius:16px;background:#090806;border:1px solid var(--ln);margin-bottom:10px}

.seg button{position:relative;z-index:1;height:44px;border-radius:12px;font:800 13px/1 var(--sans);letter-spacing:.14em;color:var(--mu);transition:color .3s;direction:ltr}

.seg button small{font:600 10px/1 var(--sans);letter-spacing:.05em;opacity:.7;margin-left:6px}
.gdsc{font-size:12.5px;color:var(--mu);text-align:center;margin-bottom:12px}

.cf{position:relative;border-radius:16px;border:1px solid var(--ln);background:#0b0a07;padding:13px 14px;margin-bottom:9px;transition:border-color .3s,transform .3s;animation:up .45s both}

.cft{display:flex;align-items:center;gap:12px}
.cfi{flex:none;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:rgba(212,169,74,.08);border:1px solid var(--ln2);font:800 13px/1 var(--sans);color:var(--g2);direction:ltr}
.cfn{flex:1;min-width:0}
.cfn b{display:block;font:800 15px/1.25 var(--sans);direction:ltr;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.tags{display:flex;gap:5px;margin-top:5px;direction:ltr;justify-content:flex-end;flex-wrap:wrap}

.tag{font:700 9.5px/1 var(--sans);letter-spacing:.1em;padding:4px 7px;border-radius:6px;background:rgba(255,255,255,.04);color:var(--mu);border:1px solid rgba(255,255,255,.06)}

.pg{flex:none;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:58px;direction:ltr}
.bars{display:flex;align-items:flex-end;gap:2px;height:14px}
.bars i{width:4px;border-radius:1px;background:rgba(255,255,255,.1)}
.bars i:nth-child(1){height:30%}.bars i:nth-child(2){height:55%}.bars i:nth-child(3){height:78%}.bars i:nth-child(4){height:100%}

.pg span{font:700 11px/1 var(--sans);color:var(--mu);font-variant-numeric:tabular-nums}
.pg.g span{color:var(--ok)}.pg.y span{color:var(--wa)}.pg.r span{color:var(--er)}
.pg.t .bars i{animation:bw 1s infinite}.pg.t .bars i:nth-child(2){animation-delay:.15s}.pg.t .bars i:nth-child(3){animation-delay:.3s}.pg.t .bars i:nth-child(4){animation-delay:.45s}

.cfa{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:12px}

.empty{text-align:center;padding:26px 10px;color:var(--mu);font-size:13px}

.steps{counter-reset:s}
.sp{display:flex;gap:13px;padding:4px 0 14px;position:relative}

.tg{display:flex;align-items:center;gap:14px;padding:16px;border-radius:var(--r);margin-bottom:14px;background:linear-gradient(120deg,#16120b,#0b0a07);border:1px solid var(--ln2);position:relative;overflow:hidden}

.tg p{font-size:12px;color:var(--mu)}
.tg .go{flex:none;font:800 12px/1 var(--sans);letter-spacing:.06em;padding:11px 13px;border-radius:12px;background:#1b160e;border:1px solid var(--ln2);color:var(--g1);direction:ltr}
.foot{text-align:center;padding:8px 0 4px;color:var(--mu2);font:600 10px/1.8 var(--sans);letter-spacing:.24em;direction:ltr}

/* dock */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:40;padding:10px 14px calc(10px + var(--safe));background:linear-gradient(180deg,transparent,rgba(6,5,4,.92) 30%);transform:translateY(120%);transition:transform .45s cubic-bezier(.2,.9,.2,1),visibility .45s;visibility:hidden}
.dock.on{transform:none;visibility:visible}

.ov.on{opacity:1;pointer-events:auto}
.sh{position:fixed;z-index:61;left:50%;bottom:0;width:100%;max-width:440px;transform:translate(-50%,105%);transition:transform .45s cubic-bezier(.2,.9,.2,1),visibility .45s;visibility:hidden;background:linear-gradient(180deg,#1a160f,#0c0a07);border:1px solid var(--ln2);border-bottom:0;border-radius:26px 26px 0 0;padding:10px 20px calc(20px + var(--safe))}

.sh .sd{font-size:12px;color:var(--mu);text-align:center;margin:2px 0 16px}
.qrb{position:relative;width:250px;max-width:76vw;margin:0 auto;padding:14px;border-radius:22px;background:#fff;box-shadow:0 0 0 6px rgba(212,169,74,.18),0 20px 40px -12px #000}
.qrb svg{width:100%;height:auto;border-radius:6px}
.qrb .ql{position:absolute;left:50%;top:50%;width:42px;height:42px;margin:-21px 0 0 -21px;border-radius:12px;background:#0b0a08;display:grid;place-items:center;box-shadow:0 0 0 4px #fff}
.qrb .ql svg{width:62%}
.sh .btn{margin-top:16px;width:100%}
.toast{position:fixed;z-index:80;left:50%;top:14px;top:calc(14px + env(safe-area-inset-top,0px));transform:translate(-50%,-140%);display:flex;align-items:center;gap:9px;padding:11px 16px;border-radius:14px;background:#1b170f;border:1px solid var(--ln2);box-shadow:0 18px 40px -12px #000;font-weight:700;font-size:13px;transition:transform .4s cubic-bezier(.2,.9,.2,1),opacity .3s,visibility .4s;max-width:calc(100% - 28px);white-space:nowrap;opacity:0;visibility:hidden}
.toast.on{transform:translate(-50%,0);opacity:1;visibility:visible}
.toast svg{width:17px;height:17px;color:var(--ok);flex:none}
/* splash */
.spl{position:fixed;top:0;right:0;bottom:0;left:0;z-index:100;background:var(--bg);display:grid;place-items:center;animation:sp .5s ease 1.6s forwards}
.spl.off{animation:sp .45s ease forwards}
.spl div{display:grid;justify-items:center;gap:14px}
.spl svg{width:54px;animation:fl 1.6s ease-in-out infinite}
.spl b{font:800 15px/1 var(--sans);letter-spacing:.5em;color:#ecd38f;padding-left:.5em}
.spl i{display:block;width:120px;height:2px;border-radius:2px;background:rgba(255,255,255,.08);overflow:hidden;position:relative}
.spl i:after{content:"";position:absolute;top:0;right:0;bottom:0;left:0;width:40%;background:var(--gold);animation:ld 1s ease-in-out infinite}
@keyframes ld{from{transform:translateX(-100%)}to{transform:translateX(260%)}}
@keyframes fl{50%{transform:translateY(-6px)}}
@keyframes sp{to{opacity:0;visibility:hidden}}
.rv{opacity:0;transform:translateY(14px);transition:opacity .6s ease,transform .6s cubic-bezier(.2,.8,.2,1)}
.rv.in{opacity:1;transform:none}
.nojs .rv{opacity:1;transform:none}
html[lang=fa] .fl{direction:rtl;text-align:right;letter-spacing:0;font:700 11.5px/1.2 var(--fa)}
html[lang=fa] .tag.bt{letter-spacing:0;font:700 10.5px/1 var(--fa)}
html[lang=fa] .foot span{letter-spacing:0;font-family:var(--fa)}
/* desktop */
@media(min-width:900px){
 .is-desk .wrap{max-width:1240px;padding:calc(28px + env(safe-area-inset-top,0px)) 36px 56px}
 .is-desk .top{height:60px;margin-bottom:20px}
 .is-desk .grid{display:grid;grid-template-columns:440px 1fr;gap:28px;align-items:start}
 .is-desk .side{position:sticky;top:24px}
 .is-desk .cfl{display:grid;grid-template-columns:1fr 1fr;gap:10px}
 .is-desk .cfl .cf{margin-bottom:0}
 .is-desk .al{display:grid;grid-template-columns:1fr 1fr;column-gap:18px}
 .is-desk .ar:nth-last-child(2):nth-child(odd){border-bottom:0}
 .is-desk .orbw{width:300px;height:300px}
 .is-desk .hn{max-width:260px}
 .is-desk .wrap .pn{padding:22px}
 .is-desk .hero{padding:24px 22px 22px}
}
.is-desk .dock{display:none}
.is-desk .sh{bottom:auto;top:50%;border-radius:26px;border-bottom:1px solid var(--ln2);transform:translate(-50%,-44%) scale(.97);opacity:0;pointer-events:none;transition:transform .35s,opacity .3s;padding:22px 24px 24px}
.is-desk .sh.on{transform:translate(-50%,-50%);opacity:1;pointer-events:auto;visibility:visible}
.is-desk .sh .gr{display:none}
.is-desk .btn:hover{border-color:rgba(247,231,176,.5)}
.is-desk .mn:hover{border-color:rgba(247,231,176,.5);color:var(--g1)}
.is-desk .cf:hover{border-color:var(--ln2);transform:translateY(-2px)}
.dsk{display:none}
.is-desk .dsk{display:block}
.scq{display:flex;align-items:center;gap:18px}
.scq .qrb{width:150px;margin:0;padding:9px;border-radius:16px;flex:none}
